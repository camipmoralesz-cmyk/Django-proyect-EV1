{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Espacio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="hero">
        <h1>Mi Espacio Personal</h1>
        <p>Un poco de todo lo que me gusta ✨</p>
    </div>

    <div class="grid">
        <a href="{% url 'inicio:detalle' categoria='artistas' %}" class="card">
            <span class="icon">🎤</span>
            <h2>Artistas Favoritos</h2>
            <p>Música que me define</p>
        </a>
        <a href="{% url 'inicio:detalle' categoria='series' %}" class="card">
            <span class="icon">📺</span>
            <h2>Series Favoritas</h2>
            <p>Mis maratones favoritas</p>
        </a>
        <a href="{% url 'mascota:mascota' %}" class="card">
            <span class="icon">🐾</span>
            <h2>Mis Mascotas</h2>
            <p>El amor de mi vida</p>
        </a>
        <a href="{% url 'inicio:detalle' categoria='libros' %}" class="card">
            <span class="icon">📚</span>
            <h2>Libros Favoritos</h2>
            <p>Historias que amo</p>
        </a>
    </div>

    <footer>Hecho con Django 🐍</footer>
</body>
</html>
