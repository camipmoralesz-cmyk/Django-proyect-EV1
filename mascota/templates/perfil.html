{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Perfil de mi mascota</title>
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
	<main class="pet-page">
		<a href="/" class="back-link">← Volver al inicio</a>
		<section class="pet-profile glass-panel">
			<img class="pet-profile-image" src="{% static 'img/gata.jpg' %}" alt="Foto de mi gata">
			<div>
				<p class="eyebrow">Mi mascota</p>
				<h1>La compañera de la casa</h1>
				<p class="muted-text">Una pequeña presentación de mi gata y de los momentos que compartimos.</p>
				<div class="pet-actions">
					<a href="{% url 'mascota:galeria' %}" class="pet-action">Ver galería</a>
				</div>
			</div>
		</section>
	</main>
</body>
</html>
